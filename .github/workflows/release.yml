name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # two responsibilities, split by trigger: a manual run opens or refreshes the release pull request, while a push to
  # `main` only tags and releases an already merged release pull request -- which is what gates the publish job below
  release-please:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # a PAT lets CI run on the release pull request; with the default token GitHub suppresses those events
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: ${{ github.event_name != 'workflow_dispatch' }}

  publish:
    name: Publish Plugin
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Detect publishing credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.ELIDE_JB_TOKEN }}
          CERT_CHAIN: ${{ secrets.ELIDE_JB_CERT_CHAIN }}
        run: |
          if [[ -n "$TOKEN" && -n "$CERT_CHAIN" ]]; then
            echo "marketplace=yes" >> "$GITHUB_OUTPUT"
          else
            echo "marketplace=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Marketplace credentials are not configured; skipping publication to JetBrains Marketplace"
          fi

      - name: Publish plugin to JetBrains Marketplace
        if: steps.credentials.outputs.marketplace == 'yes'
        run: ./gradlew publishPlugin
        env:
          ELIDE_JB_TOKEN: ${{ secrets.ELIDE_JB_TOKEN }}
          ELIDE_JB_CERT_CHAIN: ${{ secrets.ELIDE_JB_CERT_CHAIN }}
          ELIDE_JB_KEY: ${{ secrets.ELIDE_JB_KEY }}
          ELIDE_JB_KEY_PASSWORD: ${{ secrets.ELIDE_JB_KEY_PASSWORD }}

      - name: Publish plugin to Elide repository
        run: tools/deploy.sh
        env:
          ELIDE_PLUGINS_KEY: ${{ secrets.ELIDE_PLUGINS_KEY }}
          ELIDE_PLUGINS_URL: ${{ vars.ELIDE_PLUGINS_URL }}

      - name: Attach distribution to the GitHub Release
        run: gh release upload "$TAG" build/distributions/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
