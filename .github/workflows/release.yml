name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Extract release notes
        run: tools/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Detect publishing credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.ELIDE_JB_TOKEN }}
          CERT_CHAIN: ${{ secrets.ELIDE_JB_CERT_CHAIN }}
        run: |
          if [[ -n "$TOKEN" && -n "$CERT_CHAIN" ]]; then
            echo "marketplace=yes" >> "$GITHUB_OUTPUT"
          else
            echo "marketplace=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Marketplace credentials are not configured; skipping publication to JetBrains Marketplace"
          fi

      - name: Publish plugin to JetBrains Marketplace
        if: steps.credentials.outputs.marketplace == 'yes'
        run: ./gradlew publishPlugin
        env:
          ELIDE_JB_TOKEN: ${{ secrets.ELIDE_JB_TOKEN }}
          ELIDE_JB_CERT_CHAIN: ${{ secrets.ELIDE_JB_CERT_CHAIN }}
          ELIDE_JB_KEY: ${{ secrets.ELIDE_JB_KEY }}
          ELIDE_JB_KEY_PASSWORD: ${{ secrets.ELIDE_JB_KEY_PASSWORD }}

      - name: Publish plugin to Elide repository
        run: tools/deploy.sh
        env:
          ELIDE_PLUGINS_KEY: ${{ secrets.ELIDE_PLUGINS_KEY }}
          ELIDE_PLUGINS_URL: ${{ vars.ELIDE_PLUGINS_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          body_path: release-notes.md
