name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          retention-days: 7

  verify:
    name: Plugin Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # binary compatibility across the supported build range; the JetBrains Marketplace runs the same verifier on
      # every upload, so a failure here is a failure at publication time
      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          retention-days: 7
          if-no-files-found: ignore

  schema:
    name: Manifest Schema Drift
    # disabled until the first schema version is published
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `tools/codegen.sh` needs `brine`, which CI does not have; its input -- the published Pkl schema -- is checked
      # instead, since schema drift is what makes the committed model stale
      - name: Verify bundled schema matches the published schema
        run: tools/verify-schema.sh

      # when `brine` does become available on the runner, also assert the generated model itself is current
      - name: Verify generated model is current
        run: |
          if command -v brine >/dev/null 2>&1; then
            tools/codegen.sh
            git diff --exit-code -- src/main/pkl src/main/kotlin/dev/elide/tooling/manifest
          else
            echo "::notice::brine is unavailable on this runner; schema drift was still verified"
          fi
