[versions]
buildconfig = "6.0.10"
buildTimeTracker = "5.0.2"

intellij-platform = "2.16.0"
# the compile target stays on a 261 build: 2026.2 platform classes target JVM 25, which builds 253 to 261 (JBR 21)
# cannot load
intellij-target-ide = "2026.1.5"
intellij-sinceBuild = "253"
intellij-untilBuild = "262.*"

pkl-plugin = "0.37.0"

# the GDB/LLDB backends behind Native Image debugging; a marketplace plugin licensed for IntelliJ IDEA Ultimate,
# depended on optionally and never bundled with the IDE distribution
native-debug-plugin = "261.25134.147"

kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"

serialization = "1.11.0"

# reads the JaCoCo execution file `elide test --coverage` leaves for JVM tests
jacoco = "0.8.15"

logback = "1.5.18"
slf4j = "2.0.16"
# 5.13 or newer: the platform's JUnit 5 fixtures call `ExtensionContext.getEnclosingTestClasses`
junit = "5.13.4"
# only on the test runtime classpath: the platform test framework's core jar carries JUnit 4 rules and runners
junit4 = "4.13.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

jacoco-core = { group = "org.jacoco", name = "org.jacoco.core", version.ref = "jacoco" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-parameters = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

[plugins]
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
buildTimeTracker = { id = "com.asarkar.gradle.build-time-tracker", version.ref = "buildTimeTracker" }

intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-atomicfu = { id = "org.jetbrains.kotlin.plugin.atomicfu", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
