# cli global flags
cli.flag.project=Path to an Elide project to load and use
cli.flag.debug=Turn on debug logging
cli.flag.verbose=Verbose output mode
cli.flag.quiet=Quiet most output
cli.flag.timeout=Time limit for the whole run, e.g. 30s or 5m
cli.flag.color=Force color mode
cli.flag.no-color=Force no-color mode
cli.flag.coverage=Enable code coverage collection
cli.flag.profiler=Enable profiling features
cli.flag.insights=Scripts to inject via Insights API
cli.flag.error-format=Uncaught-error output: auto (default), pretty, or plain
cli.flag.abort=Abort (SIGABRT) on an uncaught exception instead of exiting
cli.flag.sandbox=Confine guest filesystem access; grant with --allow-read / --allow-write
cli.flag.allow-read=Grant filesystem read access (bare = all paths; =PATH[,PATH] to scope)
cli.flag.allow-write=Grant filesystem write access (bare = all paths; =PATH[,PATH] to scope)
cli.flag.allow-net=Permit network access (bare = all hosts; =HOST[,HOST:PORT] to scope)
cli.flag.allow-run=Permit spawning host subprocesses (bare = all; =CMD[,CMD] to scope)
cli.flag.deny-net=Deny network access to the named hosts; overrides --allow-net
cli.flag.deny-run=Deny spawning the named subprocesses; overrides --allow-run
cli.flag.fs-audit=Log each filesystem access decision (sandbox audit)
cli.flag.allow-threads=Permit guest code to create host threads (denied by default)
cli.flag.no-native=Disallow all native access
cli.flag.vm=Set a VM/engine property, e.g. -X polyglot.log.engine.level=FINE
# cli run flags
cli.flag.debugger=Enable debugging features
cli.flag.snippet=Code snippet to run
cli.flag.language=Language for an inline snippet (js, ts, python; default: js)
# cli serve and dev flags
cli.flag.host=Hostname to bind to; if one is not provided, `127.0.0.1` is used
cli.flag.serve.port=Port to serve on; if one is not provided, `8080` is used
cli.flag.dev.port=Port to serve on; if one is not provided, `3000` is used
cli.flag.no-tui=Disable the TUI and use plain log output instead
cli.flag.no-watch=Disable file watching
# cli install flags
cli.flag.slim=Download only classes, not sources or javadocs
cli.flag.fresh=Download all dependencies, refreshing artifacts in the global cache
cli.flag.direct=Download artifacts directly into the project dependencies directory instead of linking them
cli.flag.with=Maven classifier to also download: sources, docs, or javadoc
cli.flag.ecosystems=Ecosystems to install (e.g. maven,npm); defaults to maven only
cli.flag.workspace=Install every ecosystem the project declares
# cli build flags
cli.flag.inspect=List available tasks in the project
cli.flag.no-cache=Disable the build cache for this run
cli.flag.offline=Build in offline mode, avoid fetching remote resources
# cli test flags
cli.flag.test-name-pattern=Run only tests whose name matches this regular expression
cli.flag.bail=Stop the run after this many failures (default one)
cli.flag.test-timeout=Default per-test timeout in milliseconds; the global --timeout bounds the whole invocation
cli.flag.only=Run only tests marked with .only
cli.flag.concurrency=How many tests to run at once (files for JS, classes for JVM). Defaults to 1.
cli.flag.reporter=Reporter to emit results through (console, junit)
cli.flag.reporter-outfile=Where the selected reporter should write
# cli format flags
cli.flag.list-files=Print each file that fails the check or is modified by the formatter, one per line to stdout
cli.flag.list-diffs=Print a unified diff for each file that would change in check mode; with =N, only printed when failing count is at most N
# cli python flags
cli.flag.python.c=Program passed in as a string (CPython `-c CMD`). Trailing tokens become `sys.argv[1:]`.
cli.flag.python.s=Don't add the user site directory to `sys.path` (CPython `-s`).
# cli info flags
cli.flag.cargo-lockfile=Print the embedded Cargo.lock and exit
